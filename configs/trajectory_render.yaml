model:
  source_path: "./data/mipnerf360/bicycle"
  model_path: "output/bec60fe6-4"
  iteration: -1
  sh_degree: 3
  images: images
  depths: ""
  resolution: -1
  white_background: false
  train_test_exp: false
  data_device: cuda
  eval: false

pipeline:
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false
  antialiasing: false

uncertainty:
  enabled: false
  iteration: -1
  background: [0.0, 0.0, 0.0]

trajectory:
  path: "./cameras/bicycle/test.npz"
  key: cubic_trajectory
  direction_key: null
  # up: [0.0944, -0.9776, -0.1880]  # Kaolin Camera.from_args(..., up=...); not stored in the NPZ
  up: [0, -1, 0]
  camera_split: train
  reference_camera_index: 0
  intermediate_frames: 10

output:
  directory: ./output/trajectory_render
  video_name: trajectory.mp4
  fps: 30
  codec: mp4v
  save_video_frames: false
