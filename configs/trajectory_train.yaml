model:
  source_path: ./data/mipnerf360/bicycle
  model_path: ./models/bicycle
  iteration: -1
  sh_degree: 3
  images: images
  depths: ""
  resolution: -1
  white_background: false
  train_test_exp: false
  data_device: cuda
  eval: false

pipeline:
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false
  antialiasing: false

knn:
  # Defaults to <model_path>/knn_analysis/iteration_<n>/point_cloud_knn.ply.
  # Run analysis/knn.py before optimize_trajectory.py.
  ply_path: models/bicycle/knn_analysis/iteration_30000/point_cloud_knn.ply
  metric: mean
  k: 10
  # null reads the preprocessing tail threshold from the adjacent summary.json.
  tail_threshold: null
  # Empty pixels use the rendered KNN-radius q0.99 cost, preventing the camera
  # from reducing its loss by looking away from all Gaussians.
  background: 13.934244155883789
  # Divide each Gaussian's normalized KNN value by its Euclidean distance from
  # the current camera center. Mutually exclusive with splat-radius weighting.
  normalize_by_camera_distance: true
  # Multiply normalized KNN by forward.cu radii[idx] before rasterization.
  multiply_by_splat_radius: false
  # Absolute lower plateau after KNN-radius rasterization; q0.5 of the analysis.
  threshold: 0.07185056805610657

trajectory:
  # Use the .lookat file produced by SIBR's "Save key cameras..." action.
  # Legacy NPZ trajectories remain supported.
  path: ./cameras/bicycle/0171.lookat
  # When the input contains only start/end cameras, create this many trainable
  # waypoints between them before optimization.
  intermediate_waypoints: 10
  # Optimize a small set of cubic B-spline controls instead of moving every
  # waypoint independently. null restores the old per-waypoint parameters.
  spline_control_points: 4
  # key, direction_key, and up are NPZ-only; SIBR uses its saved target/up values.
  key: cubic_trajectory
  direction_key: null
  up: [0, -1, 0]
  camera_split: train
  reference_camera_index: 0

optimization:
  iterations: 200
  translation_lr: 0.005
  rotation_lr: 0.005

loss:
  knn_weight: 1000
  photometric_weight: 0.0
  translation_offset_weight: 0
  rotation_offset_weight: 0
  # Softly preserve each waypoint's SLERP-interpolated horizon while allowing
  # the view direction to optimize freely in yaw and pitch.
  roll_weight: 10.0
  acceleration_weight: 3000.0
  tangent_weight: 10000.0
  rotation_acceleration_weight: 1000.0

checkpoint:
  interval: 200
  resume: null
  intermediate_frames: 10
  fps: 30
  codec: mp4v

logging:
  wandb:
    enabled: true
    project: 3dgs-camera-gradient
    entity: null
    name: null
    mode: online

runtime:
  device: cuda
  quiet: false

output:
  directory: ./output/trajectory_train
  # Optional exact directory name below output.directory. null uses a timestamp.
  run_name: null
